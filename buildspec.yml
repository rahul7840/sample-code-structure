version: 0.2

phases:
  pre_build:
    commands:
      - echo "🔹 Logging in to Amazon ECR..."
      - aws --version
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 208116833517.dkr.ecr.ap-south-1.amazonaws.com
      - echo "🔹 Getting commit hash..."
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:-latest}
      - echo "🔹 Detecting all microservices in 'services'..."
      - SERVICES_LIST=$(ls -d services/*/ | xargs -n1 basename)
      - echo "📌 Services found: $SERVICES_LIST"
      - echo "🔹 Using image tag: $IMAGE_TAG"

  build:
    commands:
      - echo "🔹 Build started on $(date)"
      - |
        for svc in $SERVICES_LIST; do
          FULL_REPO="208116833517.dkr.ecr.ap-south-1.amazonaws.com/$svc"
          echo "⚙️ Building service: $svc"
          cd services/$svc || { echo "❌ Folder not found: $svc"; exit 1; }
          docker build -t $FULL_REPO:latest .
          docker tag $FULL_REPO:latest $FULL_REPO:$IMAGE_TAG
          cd - >/dev/null
        done

  post_build:
    commands:
      - echo "🚀 Pushing images to ECR..."
      - |
        for svc in $SERVICES_LIST; do
          FULL_REPO="208116833517.dkr.ecr.ap-south-1.amazonaws.com/$svc"
          docker push $FULL_REPO:latest
          docker push $FULL_REPO:$IMAGE_TAG
          echo "✅ Pushed $FULL_REPO:$IMAGE_TAG"
        done
      - echo "✅ Build finished at $(date)"

artifacts:
  files:
    - '**/*'
