version: 0.2

env:
  variables:
    AWS_REGION: "ap-south-1"
    AWS_ACCOUNT_ID: "208116833517"
    ECR_BASE: "208116833517.dkr.ecr.ap-south-1.amazonaws.com"
    SERVICES_ROOT: "services"   # parent folder of all microservices

phases:
  pre_build:
    commands:
      - echo "🔹 Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_BASE
      - echo "🔹 Detecting all microservices in '$SERVICES_ROOT'..."
      - SERVICES_LIST=$(ls -d $SERVICES_ROOT/*/ | xargs -n1 basename)
      - echo "📌 Services found: $SERVICES_LIST"
      - echo "🔹 Getting commit hash..."
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:-latest}
      - echo "🔹 Using image tag: $IMAGE_TAG"

  build:
    commands:
      - echo "🔹 Build started on $(date)"
      - |
        for svc in $SERVICES_LIST; do
          FULL_REPO="$ECR_BASE/$svc"
          echo "⚙️ Building service: $svc"
          cd $SERVICES_ROOT/$svc || { echo "❌ Folder not found: $svc"; exit 1; }
          docker build -t $FULL_REPO:latest .
          docker tag $FULL_REPO:latest $FULL_REPO:$IMAGE_TAG
          cd - >/dev/null
        done

  post_build:
    commands:
      - echo "🚀 Pushing images to ECR..."
      - |
        for svc in $SERVICES_LIST; do
          FULL_REPO="$ECR_BASE/$svc"
          docker push $FULL_REPO:latest
          docker push $FULL_REPO:$IMAGE_TAG
          echo "✅ Pushed $FULL_REPO:$IMAGE_TAG"
        done

      - echo "✅ Build finished at $(date)"

artifacts:
  files: []
